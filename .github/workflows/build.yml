name: Build EXE (C++)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: true

      - name: Compile
        shell: msys2 {0}
        run: |
          g++ -static -o MouseTracker.exe main.cpp -lgdi32 -Wl,-subsystem,windows

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseTracker
          path: ./MouseTracker.exe
