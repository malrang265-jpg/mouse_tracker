name: Build EXE (C++)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Compile with MinGW (g++)
        run: |
          C:\msys64\mingw64\bin\g++ -static -o MouseTracker.exe main.cpp -lgdi32 "-Wl,-subsystem,windows"
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseTracker
          path: ./MouseTracker.exe
